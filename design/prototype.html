<title>Cold-Call CRM Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left sidebar + scrolling work area; dense, keyboard-first; one teal accent on cool neutrals */
:root {
  --bg: #F7F9F9;
  --surface: #FFFFFF;
  --surface-2: #F0F4F4;
  --surface-3: #E4EBEB;
  --border: #DFE6E6;
  --border-strong: #C3CFCF;
  --fg: #0E1717;
  --fg-muted: #526464;
  --fg-subtle: #667777;
  --accent: #0F766E;
  --accent-hover: #0B5F58;
  --accent-fg: #FFFFFF;
  --accent-soft: #E2F2F0;
  --accent-text: #0F766E;
  --ring: #14B8A6;
  --ok: #15803D;      --ok-soft: #E4F4E9;
  --warn: #8A5300;    --warn-soft: #FAF0D9;
  --danger: #B91C1C;  --danger-soft: #FAE8E8;
  --info: #1D4ED8;    --info-soft: #E6EDFC;
  --neutral: #526464; --neutral-soft: #ECF1F1;
  --scrim: rgba(6, 14, 14, .45);
  --shadow: 0 1px 2px rgba(14, 23, 23, .06), 0 12px 32px rgba(14, 23, 23, .12);
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 26px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px;
  --sidebar: 224px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1111; --surface: #111A1A; --surface-2: #172222; --surface-3: #1F2C2C;
    --border: #223030; --border-strong: #314242;
    --fg: #E4EDED; --fg-muted: #9BB0B0; --fg-subtle: #7F9595;
    --accent: #2DD4BF; --accent-hover: #5EEAD4; --accent-fg: #04201D; --accent-soft: #0F2E2B; --accent-text: #5EEAD4;
    --ring: #2DD4BF;
    --ok: #4ADE80; --ok-soft: #0F2A1A; --warn: #FBBF24; --warn-soft: #2E2410;
    --danger: #F87171; --danger-soft: #331617; --info: #8AB4FF; --info-soft: #14213D;
    --neutral: #9BB0B0; --neutral-soft: #1A2525;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1111; --surface: #111A1A; --surface-2: #172222; --surface-3: #1F2C2C;
  --border: #223030; --border-strong: #314242;
  --fg: #E4EDED; --fg-muted: #9BB0B0; --fg-subtle: #7F9595;
  --accent: #2DD4BF; --accent-hover: #5EEAD4; --accent-fg: #04201D; --accent-soft: #0F2E2B; --accent-text: #5EEAD4;
  --ring: #2DD4BF;
  --ok: #4ADE80; --ok-soft: #0F2A1A; --warn: #FBBF24; --warn-soft: #2E2410;
  --danger: #F87171; --danger-soft: #331617; --info: #8AB4FF; --info-soft: #14213D;
  --neutral: #9BB0B0; --neutral-soft: #1A2525;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 var(--fs-md)/1.45 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-muted); }
.subtle { color: var(--fg-subtle); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); height: 100%; }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; overflow-y: auto; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 600; letter-spacing: -.01em; }
.brand-mark {
  width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center;
}
.brand-mark svg.i { width: 14px; height: 14px; stroke-width: 2.25; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: var(--r-md);
  color: var(--fg-muted); text-decoration: none; font-size: var(--fs-sm); font-weight: 500; border: 0; background: none; cursor: pointer; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item .count { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--fg-subtle); }
.nav-item .count.alert { color: var(--danger); font-weight: 500; }
.nav-sep { height: 1px; background: var(--border); margin: 8px 4px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 12px; }
.proto-pill {
  margin: 8px 8px 4px; padding: 6px 8px; border: 1px dashed var(--border-strong); border-radius: var(--r-md);
  font-size: var(--fs-xs); color: var(--fg-muted);
}
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: 10px; min-height: 52px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--border); background: var(--bg);
}
.topbar h1 { font-size: var(--fs-lg); font-weight: 600; margin: 0; letter-spacing: -.01em; outline: none; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.menu-btn { display: none; }
.view {
  flex: 1; overflow-y: auto; min-height: 0; position: relative;
  padding-block: 20px 48px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 25; }

/* ---------- primitives ---------- */
.btn {
  height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--fg); font-size: var(--fs-sm); font-weight: 500; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn-icon { width: 32px; padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .kbd { margin-left: 2px; }
.btn-primary .kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .75; }
.kbd {
  font-family: var(--font-mono); font-size: 11px; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: var(--r-sm);
  color: var(--fg-muted); background: var(--surface); display: inline-grid; place-items: center; line-height: 1;
}
.input, .select, .textarea {
  height: 32px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: var(--surface); font-size: var(--fs-sm); min-width: 0;
}
.textarea { height: auto; min-height: 72px; padding: 8px 10px; resize: vertical; line-height: 1.45; width: 100%; }
.input::placeholder, .textarea::placeholder { color: var(--fg-subtle); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-size: var(--fs-xs); font-weight: 500; color: var(--fg-muted); }
.field .err { font-size: var(--fs-xs); color: var(--danger); }
.field .help { font-size: var(--fs-xs); color: var(--fg-muted); }
.search { position: relative; display: flex; align-items: center; }
.search svg.i { position: absolute; left: 9px; color: var(--fg-subtle); pointer-events: none; }
.search .input { padding-left: 30px; width: 240px; max-width: 100%; }
.search .kbd { position: absolute; right: 7px; }

.chip {
  --tone: var(--neutral); --tone-soft: var(--neutral-soft);
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 500; background: var(--tone-soft); color: var(--tone); white-space: nowrap;
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tone-neutral { --tone: var(--neutral); --tone-soft: var(--neutral-soft); }
.tone-ok { --tone: var(--ok); --tone-soft: var(--ok-soft); }
.tone-warn { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.tone-danger { --tone: var(--danger); --tone-soft: var(--danger-soft); }
.tone-info { --tone: var(--info); --tone-soft: var(--info-soft); }
.tone-accent { --tone: var(--accent-text); --tone-soft: var(--accent-soft); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface-2); color: var(--fg-muted); font-size: var(--fs-xs); white-space: nowrap;
}
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: var(--fs-sm); font-weight: 600; margin: 0; }
.panel-body { padding: 16px; }
.section-title { font-size: var(--fs-xs); font-weight: 500; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-muted); font-size: var(--fs-sm); }
.empty strong { display: block; color: var(--fg); font-size: var(--fs-md); margin-bottom: 4px; }
.row-gap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- table ---------- */
.table-wrap { position: relative; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data th {
  text-align: left; font-weight: 500; color: var(--fg-muted); font-size: var(--fs-xs);
  height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface);
}
table.data td { height: 44px; padding: 4px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.row { cursor: pointer; }
table.data tr.row:hover td { background: var(--surface-2); }
table.data tr.row.is-focus td { background: var(--accent-soft); }
table.data tr.row.is-focus td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
table.data td.num, table.data th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cell-name strong { display: block; font-weight: 500; }
.cell-name span { color: var(--fg-muted); font-size: var(--fs-xs); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--tone); flex: none; }
.localtime { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- queue ---------- */
.queue { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; max-width: 1140px; }
.lead-card { padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lead-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.eyebrow { font-size: var(--fs-xs); color: var(--fg-muted); display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.eyebrow.due { color: var(--danger); font-weight: 500; }
.lead-name { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.15; text-wrap: balance; }
.lead-company { color: var(--fg-muted); margin-top: 4px; }
.phone-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-md); }
.phone { font-family: var(--font-mono); font-size: 22px; letter-spacing: .01em; font-variant-numeric: tabular-nums; user-select: all; }
.phone-row .spacer { flex: 1; }
.meta { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: var(--fs-sm); }
.meta dt { color: var(--fg-muted); }
.meta dd { margin: 0; min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.notes { font-size: var(--fs-sm); line-height: 1.55; max-width: 65ch; color: var(--fg); white-space: pre-wrap; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: var(--fs-sm); }
.timeline li:first-child { border-top: 0; }
.timeline .when { color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--fs-xs); padding-top: 3px; }
.timeline .what { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.action-panel { position: sticky; top: 0; }
.action-panel .panel-body { display: flex; flex-direction: column; gap: 14px; }
.outcome-group { display: flex; flex-direction: column; gap: 4px; }
.outcome {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; width: 100%;
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); cursor: pointer; text-align: left;
  font-size: var(--fs-sm); transition: background-color .12s ease, border-color .12s ease;
}
.outcome:hover { background: var(--surface-2); border-color: var(--border-strong); }
.outcome .kbd { margin-left: auto; }
.outcome[aria-pressed="true"] { border-color: var(--tone); background: var(--tone-soft); box-shadow: inset 0 0 0 1px var(--tone); }
.outcome .hint { color: var(--fg-subtle); font-size: var(--fs-xs); }
.fu { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
.fu-options { display: flex; flex-direction: column; gap: 4px; }
.fu-opt {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: var(--fs-sm); text-align: left; width: 100%;
}
.fu-opt small { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
.fu-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.action-foot { display: flex; gap: 8px; }
.action-foot .btn-primary { flex: 1; }
.queue-foot { max-width: 1140px; margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-muted); }
.queue-foot b { color: var(--fg); font-weight: 500; font-family: var(--font-mono); }
.upnext { max-width: 1140px; margin-top: 16px; }
.upnext ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.upnext li { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); font-size: var(--fs-sm); min-width: 0; }
.upnext li span { display: block; color: var(--fg-muted); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.today { font-size: var(--fs-xs); color: var(--fg-muted); }
.today b { font-family: var(--font-mono); color: var(--fg); font-weight: 500; }

/* ---------- follow-ups ---------- */
.fu-group { max-width: 1000px; margin-bottom: 20px; }
.fu-group .table-wrap { margin-top: 4px; }
.due-overdue { color: var(--danger); font-weight: 500; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .count { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-muted); }

/* ---------- lead detail ---------- */
.detail { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; max-width: 1100px; align-items: start; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-muted); text-decoration: none; font-size: var(--fs-sm); margin-bottom: 12px; }
.back:hover { color: var(--fg); }
.detail-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; max-width: 1100px; margin-bottom: 16px; }

/* ---------- import ---------- */
.steps { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0 0 16px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--fg-muted); }
.steps li + li::before { content: ""; width: 24px; height: 1px; background: var(--border-strong); }
.steps .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-family: var(--font-mono); border: 1px solid var(--border-strong); }
.steps li[aria-current="step"] { color: var(--fg); font-weight: 500; }
.steps li[aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.steps li.done .n { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-text); }
.drop {
  border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg); padding: 32px 16px; text-align: center;
  display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0; color: var(--fg-muted); font-size: var(--fs-sm); }
.imp { max-width: 860px; display: flex; flex-direction: column; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* ---------- stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 1140px; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile .k { font-size: var(--fs-xs); color: var(--fg-muted); }
.tile .v { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .d { font-size: var(--fs-xs); font-family: var(--font-mono); }
.d.up { color: var(--ok); } .d.down { color: var(--danger); } .d.flat { color: var(--fg-muted); }
.stats-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; max-width: 1140px; margin-top: 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--border); }
.chart text { fill: var(--fg-muted); font-family: var(--font-mono); font-size: 10px; }
.chart .b-conn { fill: var(--accent); }
.chart .b-other { fill: var(--surface-3); }
.chart .b-today { stroke: var(--fg); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--fg-muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: var(--fs-sm); }
.hbar .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--tone); border-radius: 4px; }
.hbar .n { text-align: right; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--fg-muted); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.seg button { border: 0; background: var(--surface); height: 30px; padding: 0 12px; font-size: var(--fs-sm); cursor: pointer; color: var(--fg-muted); }
.seg button + button { border-left: 1px solid var(--border-strong); }

/* ---------- queue logic ---------- */
function queueState(scope) {
  const t = now(), gap = settings.retryGapH * H;
  const eligible = [], outside = [], waiting = [], scheduled = [];
  for (const l of leads) {
    if (TERMINAL.has(l.status)) continue;
    if (scope !== "all" && l.listId !== scope) continue;
    if (l.followUpAt && l.followUpAt > t) { scheduled.push(l); continue; }
    const due = l.followUpAt && l.followUpAt <= t;
    const last = lastCall(l);
    if (!due && last && RETRY_OUTCOMES.has(last.o) && last.at + gap > t) { waiting.push(l); continue; }
    if (!inWindow(l, t)) { outside.push(l); continue; }
    eligible.push(l);
  }
  const rank = l => (l.followUpAt && l.followUpAt <= t) ? 0 : (l.calls.length ? 2 : 1);
  const key = l => rank(l) === 0 ? l.followUpAt : rank(l) === 1 ? l.created : lastCall(l).at;
  eligible.sort((a, b) => rank(a) - rank(b) || key(a) - key(b));
  return { eligible, outside, waiting, scheduled };
}
function reasonOf(l) {
  const t = now();
  if (l.followUpAt && l.followUpAt <= t) return { text: `Follow-up due ${rel(l.followUpAt)}`, due: true };
  const last = lastCall(l);
  if (!last) return { text: "First call" };
  return { text: `Last call ${rel(last.at)} · ${OUT[last.o].label}` };
}

const FIELDS = [["ignore", "Don't import"], ["name", "Name"], ["company", "Company"], ["phone", "Phone"], ["email", "Email"], ["website", "Website"], ["country", "Country"], ["tags", "Tags"], ["notes", "Notes"]];
function guessField(h) {
  h = h.toLowerCase();
  if (/phone|tel|mobile|number/.test(h)) return "phone";
  if (/business|company|organi[sz]ation/.test(h)) return "company";
  if (/name|contact/.test(h)) return "name";
  if (/mail/.test(h)) return "email";
  if (/web|url|site/.test(h)) return "website";
  if (/country/.test(h)) return "country";
  if (/tag/.test(h)) return "tags";
  if (/note|comment/.test(h)) return "notes";
  return "ignore";
}
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.some(v => v.trim())) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if (row.some(v => v.trim())) rows.push(row);
  return rows;
}

function importPlan() {
  const { file, country } = state.imp, m = file.map;
  const col = f => m.indexOf(f);
  const existing = new Map(leads.map(l => [l.e164, l]));
  const seen = new Set(); const add = [], dup = [], invalid = [], dnc = [];
  for (const r of file.rows) {
    const rc = col("country") >= 0 && COUNTRIES[(r[col("country")] || "").trim().toUpperCase()] ? r[col("country")].trim().toUpperCase() : country;
    const e164 = col("phone") >= 0 ? normPhone(r[col("phone")], rc) : null;
    if (!e164) { invalid.push(r); continue; }
    const ex = existing.get(e164);
    if (ex && ex.status === "do_not_call") { dnc.push(r); continue; }
    if (ex || seen.has(e164)) { dup.push(r); continue; }
    seen.add(e164);
    add.push({ r, e164, country: countryOf(e164) || rc });
  }
  return { add, dup, invalid, dnc };
}

/* ---------- stats ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    const conv = Math.round(calls * (0.2 + r() * 0.14));
    const interested = Math.round(conv * (0.18 + r() * 0.12));

    out.push({ day, calls: i === 0 ? Math.round(calls * 0.45) : calls, conv: i === 0 ? Math.round(conv * 0.45) : conv, interested, meetings });
  }

})();
function periodData(days) {

  last.conv += state.sessionLog.filter(o => CONVERSATION.has(o)).length;
  last.interested += state.sessionLog.filter(o => o === "interested").length;
  last.meetings += state.sessionLog.filter(o => o === "meeting_booked").length;
  const prev = SERIES.slice(-days * 2, -days);

}

}
function viewStats() {
  const { cur, prev, sum } = periodData(state.period);
  const calls = sum(cur, "calls"), conv = sum(cur, "conv"), won = sum(cur, "interested") + sum(cur, "meetings"), meet = sum(cur, "meetings");
  const pCalls = sum(prev, "calls"), pConv = sum(prev, "conv"), pWon = sum(prev, "interested") + sum(prev, "meetings"), pMeet = sum(prev, "meetings");
  const rate = calls ? conv / calls : 0, pRate = pCalls ? pConv / pCalls : 0;

  const brk = [
    ["no_answer", Math.round(nc * 0.56)], ["voicemail", Math.round(nc * 0.3)], ["gatekeeper", nc - Math.round(nc * 0.56) - Math.round(nc * 0.3) - Math.round(nc * 0.04)], ["wrong_number", Math.round(nc * 0.04)],
    ["callback", Math.round(conv * 0.3)], ["interested", sum(cur, "interested")], ["meeting_booked", meet], ["not_interested", Math.max(0, conv - Math.round(conv * 0.3) - sum(cur, "interested") - meet - Math.round(conv * 0.03))], ["do_not_call", Math.round(conv * 0.03)],
  ];

      <div class="panel tile"><span class="k">Calls</span><span class="v">${calls.toLocaleString("en-GB")}</span>${delta(calls, pCalls)}</div>
      <div class="panel tile"><span class="k">Conversation rate</span><span class="v">${(rate * 100).toFixed(1)}%</span>${delta(rate, pRate)}</div>
      <div class="panel tile"><span class="k">Interested or booked</span><span class="v">${won}</span>${delta(won, pWon)}</div>
      <div class="panel tile"><span class="k">Meetings booked</span><span class="v">${meet}</span>${delta(meet, pMeet)}</div>
    </div>
    <div class="stats-grid">
      <section class="panel" aria-labelledby="cTitle">
        <div class="panel-head"><h2 id="cTitle">Calls per day</h2><div class="legend" style="margin-left:auto"><span><i style="background:var(--accent)"></i>Conversation</span><span><i style="background:var(--surface-3)"></i>No conversation</span></div></div>

function callsChart(data) {

        ${(data.length - 1 - i) % every === 0 ? `<text x="${(x + w / 2).toFixed(1)}" y="${Hh - 8}" text-anchor="middle">${isToday ? "Today" : fmtDate(d.day)}</text>` : ""}</g>`; }).join("")}
  </svg>`;
}

  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), r = state.route.r;
  if (gPending) {
    gPending = false; clearTimeout(gTimer);
    const n = NAV.find(x => x.key === k); if (n) { e.preventDefault(); closeNav(); go(n.r); }
    return;
  }
  if (k === "g") { gPending = true; gTimer = setTimeout(() => gPending = false, 1200); return; }
  if (e.key === "?") { e.preventDefault(); openHelp(); return; }
  if (k === "u" && toastUndo) { e.preventDefault(); doUndo(); return; }
  if (r === "queue") {
    const o = OUTCOMES.find(x => x.key === e.key);
    if (o) { e.preventDefault(); pickOutcome(o.k); return; }
    if (k === "n") { e.preventDefault(); $("#note")?.focus(); return; }
    if (k === "s") { e.preventDefault(); skip(); return; }
    if (k === "c") { e.preventDefault(); copyPhone(); return; }
    if (e.key === "Enter" && state.outcome && !e.target.closest("button, a")) { e.preventDefault(); confirmLog(); return; }
    if (e.key === "Escape" && state.outcome) { state.outcome = null; renderView(); return; }
  }
  if (r === "leads") {
    if (e.key === "/") { e.preventDefault(); $("#search").focus(); return; }
    if (k === "j") { e.preventDefault(); moveRow(1); return; }
    if (k === "k") { e.preventDefault(); moveRow(-1); return; }
    if (k === "a") { e.preventDefault(); openLeadForm(); return; }
    if (e.key === "Enter" && !e.target.closest("button, a")) { const row = $$("#leadRows tr.row")[state.rowFocus]; if (row) go("lead-" + row.dataset.lead); return; }
  }
  if (r === "lead" && e.key === "Escape") go("leads");
});

state.route = parseHash();
render(false);
})();
</script>
